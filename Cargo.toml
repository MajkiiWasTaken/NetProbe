[package]
name = "netprobe"
version = "0.6.0"
edition = "2024"

[[bin]]
name = "nprobe"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
toml = "0.9"